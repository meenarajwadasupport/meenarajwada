name = "meenarajwada-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://www.meenarajwada.com"

[[d1_databases]]
binding = "DB"
database_name = "meenarajwada-catalog"
database_id = "08f1006f-828a-47dc-9450-fc1f48e2f53a"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "meenarajwada-media"

# SUPABASE_JWT_SECRET must be added via:
#   npx wrangler secret put SUPABASE_JWT_SECRET
